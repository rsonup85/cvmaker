<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="feltBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e5436"/>
      <stop offset="70%" stop-color="#123422"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer circle / background -->
  <rect width="512" height="512" rx="100" fill="url(#feltBg)" stroke="#2a5a3a" stroke-width="12"/>
  
  <!-- Inner border ring -->
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="#e8c547" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8"/>
  
  <!-- Center Playing Card -->
  <g transform="translate(156, 116)">
    <rect width="200" height="280" rx="18" fill="#f8f4ec" stroke="#e67e22" stroke-width="6" filter="url(#goldGlow)"/>
    <!-- Rank 10 -->
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#e74c3c">10</text>
    <text x="26" y="86" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#e74c3c">♥</text>
    <!-- Big Center Spade -->
    <text x="100" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="96" fill="#1a1a1a">♠</text>
    <!-- Star -->
    <polygon points="100,208 108,228 130,228 112,242 118,262 100,248 82,262 88,242 70,228 92,228" fill="#f59e0b"/>
  </g>

  <!-- Title Header Banner -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#e8c547" letter-spacing="4">DAHLA PAKAD</text>
</svg>
